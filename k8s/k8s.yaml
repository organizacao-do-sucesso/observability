# Observability stack for the store namespace: metrics (Prometheus), logs (Alloy -> Loki)
# and dashboards (Grafana). Nothing here is exposed: the gateway routes /grafana/** and
# /prometheus/** to these Services, like every other service of the platform.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: store
data:
  # public address of the gateway, used by Grafana and Prometheus to build links and redirects
  # (in AWS, patch it with the DNS of the gateway's load balancer)
  OBSERVABILITY_PUBLIC_URL: http://localhost:8080
---
# ---------------------------------------------------------------- Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: store
rules:
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          env:
            - name: OBSERVABILITY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: OBSERVABILITY_PUBLIC_URL
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            # served under /prometheus so the gateway can route to it
            - --web.route-prefix=/prometheus
            - --web.external-url=$(OBSERVABILITY_PUBLIC_URL)/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: store
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
# ---------------------------------------------------------------- Loki
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.5.0
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: store
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
# ---------------------------------------------------------------- Alloy (log collector)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
  namespace: store
rules:
  - apiGroups: [ "" ]
    resources: [ pods, pods/log ]
    verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
  namespace: store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
# ---------------------------------------------------------------- Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - name: OBSERVABILITY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: OBSERVABILITY_PUBLIC_URL
            # served under /grafana so the gateway can route to it
            - name: GF_SERVER_ROOT_URL
              value: $(OBSERVABILITY_PUBLIC_URL)/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          envFrom:
            # GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD
            - secretRef:
                name: grafana-secret
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: store
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
