global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: [ 'localhost:9090' ]

  # Every container labeled prometheus.scrape=true is scraped automatically,
  # so adding a service never requires changing this file.
  - job_name: services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: [ 'prometheus.scrape=true' ]
    relabel_configs:
      - source_labels: [ __meta_docker_network_ip, __meta_docker_container_label_prometheus_port ]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [ __meta_docker_container_label_prometheus_path ]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [ __meta_docker_container_label_com_docker_compose_service ]
        target_label: service
      - source_labels: [ __meta_docker_container_name ]
        regex: /(.*)
        target_label: container
