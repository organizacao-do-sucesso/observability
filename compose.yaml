# Observability stack for the store platform: metrics, logs and dashboards.
#
# Meant to be included from platform/api/compose.yaml (`include:`), so it joins
# the same network as the services. Services opt in with docker labels:
#
#   labels:
#     prometheus.scrape: "true"                     # scrape metrics
#     prometheus.port: "8080"                       # port inside the container
#     prometheus.path: /order/actuator/prometheus   # metrics path
#     logs.collect: "true"                          # ship stdout/stderr to Loki
#
# Grafana:    http://localhost:3000  (admin / admin by default)
# Prometheus: http://localhost:9090

services:

  prometheus:
    image: prom/prometheus:v3.5.0
    hostname: prometheus
    user: root   # needs to read the docker socket for service discovery
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090

  loki:
    image: grafana/loki:3.5.0
    hostname: loki
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.10.0
    hostname: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
